name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sin vendor/)
        uses: actions/checkout@v4
        with:
          # vendor/ pesa ~28 MB y no hace falta acá: el chequeo de precache
          # omite a propósito las entradas de vendor/ (las cubre el job de
          # integridad) y los tests no lo necesitan.
          sparse-checkout: |
            js/
            tests/
            tools/
            css/
            assets/
            index.html
            sw.js
            manifest.json
            package.json
          sparse-checkout-cone-mode: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar tests
        run: npm test

      - name: Verificar precache del Service Worker
        # Falla si index.html referencia un asset que el precache no cubre con
        # la URL exacta (un ?v= alcanza para que caches.match() nunca lo sirva),
        # si un módulo del grafo de imports quedó fuera de la lista, o si el
        # precache apunta a un archivo inexistente (cache.addAll() es atómico).
        run: node tools/check-precache.js

  checksums:
    name: Integridad de vendor/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4

      - name: Verificar checksums SHA-256
        run: sha256sum -c vendor/CHECKSUMS.txt

      - name: Verificar cobertura de CHECKSUMS.txt
        # sha256sum -c solo verifica lo listado: un archivo nuevo en vendor/
        # sin checksum pasaría inadvertido. Este paso falla si vendor/ y
        # CHECKSUMS.txt no coinciden exactamente (archivo sin checksum o
        # entrada huérfana).
        run: |
          git ls-files vendor/ | grep -vx 'vendor/CHECKSUMS.txt' | sort > /tmp/vendor-real.txt
          sed -E 's/^[0-9a-f]{64}[[:space:]]+\*?//' vendor/CHECKSUMS.txt | sort > /tmp/vendor-listado.txt
          if ! diff -u /tmp/vendor-listado.txt /tmp/vendor-real.txt; then
            echo '::error::vendor/ y CHECKSUMS.txt no coinciden: hay archivos sin checksum o entradas huérfanas'
            exit 1
          fi
